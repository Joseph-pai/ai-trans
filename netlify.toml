[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
    [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/icons/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
    [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
    [headers.values]
    Cache-Control = "public, max-age=86400"
